<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #editor-area blockquote {
      margin: 0.5rem 0;
      padding: 0.4rem 1rem;
      color: #555;
      background: #f9f9f9;
    }
    #editor-area a { color: #2563eb; text-decoration: underline; }
    #editor-area img { max-width: 100%; border-radius: 6px; margin: 8px 0; display: block; cursor: pointer; }
    #editor-area img.img-selected { outline: 3px solid #2563eb; outline-offset: 2px; }
    #editor-area ul { list-style-type: disc !important; padding-left: 1.5rem !important; margin: 0.4em 0; }
    #editor-area ol { list-style-type: decimal !important; padding-left: 1.5rem !important; margin: 0.4em 0; }
    #editor-area li { display: list-item !important; }
    #editor-area h1 { font-size: 2em; font-weight: 600; margin: 0.4em 0; }
    #editor-area h2 { font-size: 1.6em; font-weight: 600; margin: 0.4em 0; }
    #editor-area h3 { font-size: 1.3em; font-weight: 600; margin: 0.4em 0; }
    #editor-area h4 { font-size: 1.1em; font-weight: 600; margin: 0.4em 0; }
    #editor-area h5 { font-size: 0.95em; font-weight: 600; margin: 0.4em 0; }
    #editor-area h6 { font-size: 0.85em; font-weight: 600; margin: 0.4em 0; color: #777; }
  </style>
</head>

<body class="bg-gray-50 font-sans">

<main class="max-w-3xl mx-auto my-10 bg-white">

  <div class="flex flex-wrap gap-1 p-2 sticky top-0 bg-white z-10 rounded-t-xl">
    <select id="block-select" class="text-sm  px-2 py-1 cursor-pointer">
      <option value="p">Paragraf</option>
      <option value="h1">H1</option>
      <option value="h2">H2</option>
      <option value="h3">H3</option>
      <option value="h4">H4</option>
      <option value="h5">H5</option>
      <option value="h6">H6</option>
    </select>

    <div class="w-px bg-gray-200 mx-1"></div>

    <button class="tb-btn px-2 py-1 text-xs border rounded-md" data-cmd="bold"><b>Bold</b></button>
    <button class="tb-btn px-2 py-1 text-xs border rounded-md" data-cmd="italic"><i>Italic</i></button>

    <div class="w-px bg-gray-200 mx-1"></div>

    <button class="tb-btn px-2 py-1 text-xs border rounded-md" data-cmd="insertUnorderedList">• List</button>
    <button class="tb-btn px-2 py-1 text-xs border rounded-md" data-cmd="insertOrderedList">1. Number</button>

    <div class="w-px bg-gray-200 mx-1"></div>

    <button class="tb-btn px-2 py-1 text-xs border rounded-md underline" id="btn-underline">Underline</button>

    <div class="w-px bg-gray-200 mx-1"></div>

    <button class="tb-btn px-2 py-1 text-xs border rounded-md" id="btn-link">Link</button>
    <button class="tb-btn px-2 py-1 text-xs border rounded-md" id="btn-img">Image</button>

    <div class="w-px bg-gray-200 mx-1"></div>

    <button class="tb-btn px-2 py-1 text-xs border rounded-md" id="btn-load">Muat HTML</button>
    <button class="tb-btn px-2 py-1 text-xs border rounded-md" id="btn-copy">Salin</button>
  </div>

  <section class="p-4">
    <div id="editor-area" contenteditable="true"
      class="min-h-[320px] outline-none text-[15px] text-gray-800 empty:before:content-[attr(data-placeholder)] empty:before:text-gray-400"
      data-placeholder="Mulai menulis di sini...">
    </div>
    <p class="text-xs text-gray-400 mt-2">Text editor by @1bbnuuu</p>
  </section>

  <div id="modal-container"></div>

</main>

<script>
const editor = document.getElementById('editor-area');
const blockSel = document.getElementById('block-select');
const modalContainer = document.getElementById('modal-container');
let savedRange = null;

function saveRange() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount) savedRange = sel.getRangeAt(0).cloneRange();
}
function restoreRange() {
  if (!savedRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(savedRange);
}

function exec(cmd, val) {
  editor.focus();
  document.execCommand(cmd, false, val || null);
}

document.querySelectorAll('.tb-btn[data-cmd]').forEach(btn => {
  btn.addEventListener('mousedown', e => {
    e.preventDefault();
    exec(btn.dataset.cmd);
  });
});

blockSel.addEventListener('change', () => {
  exec('formatBlock', blockSel.value);
});

document.getElementById('btn-underline').addEventListener('mousedown', e => {
  e.preventDefault();
  exec('underline');
});

function updateBlockSelect() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;

  let node = sel.getRangeAt(0).startContainer;
  if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;

  const blockTags = ['H1','H2','H3','H4','H5','H6','P','BLOCKQUOTE'];
  while (node && node !== editor) {
    if (blockTags.includes(node.nodeName)) {
      const tag = node.nodeName.toLowerCase();
      const match = [...blockSel.options].find(o => o.value === tag);
      if (match) blockSel.value = tag;
      else blockSel.value = 'p';
      return;
    }
    node = node.parentNode;
  }
  blockSel.value = 'p';
}

editor.addEventListener('keyup', updateBlockSelect);
editor.addEventListener('mouseup', updateBlockSelect);
editor.addEventListener('selectionchange', updateBlockSelect);
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (sel && sel.rangeCount && editor.contains(sel.getRangeAt(0).startContainer)) {
    updateBlockSelect();
  }
});

// ---- Image select & delete support ----
function clearImageSelection() {
  editor.querySelectorAll('img.img-selected').forEach(img => img.classList.remove('img-selected'));
}

editor.addEventListener('click', (e) => {
  if (e.target.tagName === 'IMG') {
    clearImageSelection();
    e.target.classList.add('img-selected');

    // Also place a native node-selection around the image so
    // browser-native editing behaviors stay consistent.
    const range = document.createRange();
    range.selectNode(e.target);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    clearImageSelection();
  }
});

editor.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const selectedImg = editor.querySelector('img.img-selected');
    if (selectedImg) {
      e.preventDefault();
      selectedImg.remove();
    }
  }
});

// If content changes (e.g. new HTML loaded) drop any stale selection state
const editorObserver = new MutationObserver(clearImageSelection);
editorObserver.observe(editor, { childList: true, subtree: true });

function showModal(content, callback) {
  modalContainer.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:50;">
      ${content}
    </div>
  `;

  const overlay = modalContainer.firstElementChild;
  overlay.addEventListener('click', e => {
    if (e.target === overlay) modalContainer.innerHTML = '';
  });

  const cancel = overlay.querySelector('.btn-cancel');
  if (cancel) cancel.onclick = () => modalContainer.innerHTML = '';

  callback && callback(overlay);
}

document.getElementById('btn-link').onclick = () => {
  saveRange();
  showModal(`
    <div class="bg-white w-[380px] rounded-xl p-5 space-y-3">
      <h3 class="font-semibold">Sisipkan Link</h3>
      <input id="m-text" class="w-full border px-3 py-2 rounded" placeholder="Teks" />
      <input id="m-url" class="w-full border px-3 py-2 rounded" placeholder="URL" />
      <div class="flex justify-end gap-2">
        <button class="btn-cancel px-3 py-1 bg-gray-200 rounded">Batal</button>
        <button id="m-ok" class="px-3 py-1 bg-blue-600 text-white rounded">OK</button>
      </div>
    </div>
  `, c => {
    c.querySelector('#m-ok').onclick = () => {
      const text = c.querySelector('#m-text').value.trim();
      const url = c.querySelector('#m-url').value.trim();
      if (!url) return;
      restoreRange();
      exec('insertHTML', `<a class="text-blue-600 underline" href="${url}" target="_blank">${text || url}</a>`);
      modalContainer.innerHTML = '';
    };
  });
};

document.getElementById('btn-img').onclick = () => {
  saveRange();
  showModal(`
    <div class="bg-white w-[380px] rounded-xl p-5 space-y-3 shadow-xl">
      <h3 class="font-semibold">Sisipkan Gambar</h3>
      <input id="m-src" class="w-full border px-3 py-2 rounded" placeholder="URL gambar" />
      <div class="flex justify-end gap-2">
        <button class="btn-cancel px-3 py-1 bg-gray-200 rounded">Batal</button>
        <button id="m-ok" class="px-3 py-1 bg-blue-600 text-white rounded">OK</button>
      </div>
    </div>
  `, c => {
    c.querySelector('#m-ok').onclick = () => {
      const src = c.querySelector('#m-src').value.trim();
      if (!src) return;
      restoreRange();
      exec('insertImage', src);
      modalContainer.innerHTML = '';
    };
  });
};

document.getElementById('btn-load').onclick = () => {
  const hasContent = editor.innerHTML.trim() !== '';
  showModal(`
    <div class="bg-white w-[420px] rounded-xl p-5 space-y-3 shadow-xl">
      <h3 class="font-semibold">Load HTML</h3>
      <textarea id="m-html" class="w-full h-32 border px-3 py-2 rounded"></textarea>
      ${hasContent ? `<p class="text-red-500 text-sm">Editor sudah ada isi</p>` : ''}
      <div class="flex justify-end gap-2">
        <button class="btn-cancel px-3 py-1 bg-gray-200 rounded">Batal</button>
        ${hasContent ? `<button id="m-append" class="px-3 py-1 bg-yellow-500 text-white rounded">Tambah</button>` : ''}
        <button id="m-replace" class="px-3 py-1 bg-blue-600 text-white rounded">OK</button>
      </div>
    </div>
  `, c => {
    const ta = c.querySelector('#m-html');
    ta.focus();
    c.querySelector('#m-replace').onclick = () => {
      const html = ta.value.trim();
      if (!html) return;
      editor.innerHTML = sanitizeHTML(html);
      modalContainer.innerHTML = '';
    };
    const append = c.querySelector('#m-append');
    if (append) {
      append.onclick = () => {
        const html = ta.value.trim();
        if (!html) return;
        editor.innerHTML += sanitizeHTML(html);
        modalContainer.innerHTML = '';
      };
    }
  });
};

document.getElementById('btn-copy').onclick = () => {
  const clean = editor.innerHTML.replace(/ class="[^"]*"/g, '');
  showModal(`
    <div class="bg-white w-[400px] rounded-xl p-5 space-y-3 shadow-xl">
      <h3 class="font-semibold">Copy HTML</h3>
      <div class="bg-gray-100 p-2 text-sm rounded max-h-40 overflow-auto">${clean.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      <div class="flex justify-end gap-2">
        <button class="btn-cancel px-3 py-1 bg-gray-200 rounded">Tutup</button>
        <button id="m-ok" class="px-3 py-1 bg-blue-600 text-white rounded">Copy</button>
      </div>
    </div>
  `, c => {
    c.querySelector('#m-ok').onclick = () => {
      navigator.clipboard.writeText(clean);
      modalContainer.innerHTML = '';
    };
  });
};

function sanitizeHTML(html) {
  return html.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, '');
}
</script>

</body>
</html>
